name: Build APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools" >> $GITHUB_PATH
          ls "$SDK" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew --no-daemon assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -400 /tmp/build.log > /tmp/tail.log
            echo "构建失败，尝试上传日志"
            url=$(curl -s --max-time 30 --data-binary @/tmp/tail.log https://paste.rs || true)
            echo "日志地址: $url" || true
            curl -s --max-time 30 -F "file=@/tmp/tail.log" https://0x0.st || true
          fi
          exit $code

      - name: Publish failure log
        if: failure()
        run: |
          tail -500 /tmp/build.log > ci-failure.log 2>/dev/null || echo "no log" > ci-failure.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-failure.log
          git commit -m "ci: 失败日志 $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push -f origin ci-log || true

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taosheng-debug-apk
          path: out/*.apk
          if-no-files-found: error
